# Serverga deploy — GitHub serverlaridan.
#
# NEGA KERAK (2026-08-20): O'zbekiston–Germaniya magistral kanalida uzilish
# bo'ldi (provayder tasdiqladi: server ishlayapti, muammo kanalda). Bizning
# tarmoqdan serverga na SSH, na HTTPS, na ICMP o'tmaydi. GitHub serverlari
# esa boshqa yo'ldan boradi — `watchdog.yml` shu paytda ham `HTTP 200`
# olgan, ya'ni bu yo'l ishlaydi.
#
# Kanal tiklangandan keyin ham bu ish oqimi FOYDALI qoladi: deploy qadamlari
# bir joyda yozilgan va qo'lda terilmaydi (unutilgan `alembic upgrade` —
# saytni jimgina buzadigan eng keng tarqalgan xato).
#
# ⚠️ FAQAT QO'LDA ishga tushadi (`workflow_dispatch`). `push` da AVTOMATIK
# deploy ATAYLAB yo'q: master'ga tushgan har commit darhol productionga
# chiqishi kerak emas — deploy odam qaror qiladigan amal.
#
# SOZLASH (bir marta, repo egasi qiladi):
#   Settings → Secrets and variables → Actions → New repository secret
#     DEPLOY_SSH_KEY = ~/.ssh/id_ed25519_hodimlar_cpanel faylining TO'LIQ
#                      mazmuni (`-----BEGIN` dan `-----END` gacha)
#   Ixtiyoriy: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER — berilmasa quyidagi
#   standart qiymatlar ishlatiladi.
name: Serverga deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Qaysi branch/commit deploy qilinsin"
        default: "master"
        required: true
      skip_backup:
        description: "Zaxira nusxani o'tkazib yuborish (tavsiya etilmaydi)"
        type: boolean
        default: false

# Ikki deploy bir vaqtda ketmasin — yarim ko'chirilgan holat eng yomoni.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH kalitini o'rnatish
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY sekreti sozlanmagan. Repo Settings → Secrets and variables → Actions da qo'shing."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host kaliti oldindan ma'lum emas — `accept-new` bilan birinchi
          # ulanishda eslab qolinadi. `StrictHostKeyChecking=no` EMAS:
          # keyingi ulanishlarda kalit o'zgarsa ish oqimi to'xtaydi.
          cat >> ~/.ssh/config <<'EOF'
          Host deploy-target
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 30
            ServerAliveInterval 15
          EOF

      - name: Ulanishni tekshirish
        env:
          HOST: ${{ secrets.DEPLOY_HOST || '167.235.222.200' }}
          PORT: ${{ secrets.DEPLOY_PORT || '30151' }}
          USER_NAME: ${{ secrets.DEPLOY_USER || 'nuriddi5' }}
        run: |
          set -uo pipefail
          {
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $USER_NAME"
          } >> ~/.ssh/config
          # Kanal beqaror: watchdog jurnalida server soatlab yetib
          # kelmay, keyin qaytadi (08:07 ✓, 10:02 ✓, 10:59 ✗, 11:36 ✗).
          # Shuning uchun sabr uzun — 20 urinish, ~15 daqiqa. Ish oqimi
          # baribir QO'LDA ishga tushadi, ya'ni bekorga kutmaydi.
          for i in $(seq 1 20); do
            if ssh deploy-target 'echo ULANDI; hostname' ; then
              exit 0
            fi
            echo "urinish $i muvaffaqiyatsiz — 40 soniyadan keyin qayta"
            sleep 40
          done
          # Ikki xil sabab bo'lishi mumkin — ularni ajratib beramiz,
          # aks holda «ulanmadi» degan xabar bilan qolinardi.
          echo "SSH ulanmadi. HTTPS holatini tekshiramiz:"
          CODE=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}'             "https://nuriddin-building.uz/api/health" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "::error::Sayt OCHIQ (HTTP 200), lekin SSH porti yopiq — bu server FIREWALL'i (CSF) GitHub IP'sini bloklayotganini bildiradi. cPanel → ConfigServer Security & Firewall da GitHub Actions IP oralig'ini ruxsat ro'yxatiga qo'shish kerak, yoki VPN orqali qo'lda deploy qiling."
          else
            echo "::error::Server umuman javob bermayapti (HTTPS ham: $CODE). Kanal/server tiklanganda qayta urinib ko'ring."
          fi
          exit 1

      - name: Zaxira nusxa (migratsiyadan OLDIN)
        if: ${{ !inputs.skip_backup }}
        run: |
          set -uo pipefail
          # 10 ta migratsiya qo'llanadi — zaxira arzon sug'urta.
          # Muvaffaqiyatsiz bo'lsa deploy TO'XTAYDI: zaxirasiz migratsiya
          # qilish qaytarib bo'lmaydigan xavf.
          ssh deploy-target 'bash ~/hodimlar-tizimi/deploy/cpanel/backup_db.sh' || {
            echo "::error::Zaxira nusxa olinmadi — deploy to'xtatildi."
            exit 1
          }

      - name: Kodni yangilash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ssh deploy-target "bash -lc '
            set -euo pipefail
            cd ~/hodimlar-tizimi
            echo \"OLDINGI: \$(git rev-parse --short HEAD) \$(git log -1 --pretty=%s)\"
            git fetch origin --prune
            git checkout ${REF}
            git reset --hard origin/${REF}
            echo \"YANGI:   \$(git rev-parse --short HEAD) \$(git log -1 --pretty=%s)\"
          '"

      - name: Bog'liqliklarni yangilash
        run: |
          set -euo pipefail
          # Faqat `requirements.txt` o'zgargan bo'lsa — har deployда
          # `pip install` cPanel'da sekin va kerak emas.
          ssh deploy-target "bash -lc '
            set -euo pipefail
            cd ~/hodimlar-tizimi
            PY=~/virtualenv/hodimlar-tizimi/3.11/bin/python
            if git diff --name-only HEAD@{1} HEAD 2>/dev/null | grep -q \"requirements.txt\"; then
              echo \"requirements.txt o'zgardi — o'rnatilmoqda\"
              \$PY -m pip install -q -r deploy/cpanel/requirements.txt
            else
              echo \"requirements.txt o'zgarmagan — o'tkazib yuborildi\"
            fi
          '"

      - name: Migratsiya
        run: |
          set -euo pipefail
          # ⚠️ `upgrade heads` (`head` EMAS): parallel ish tufayli bir necha
          # shox bo'lgan va birlashtiruvchi migratsiyalar bor. `head` bilan
          # ularning bir qismi qo'llanmay qolardi.
          #
          # Bu qadam yiqilsa keyingi qadamlar ISHLAMAYDI — migratsiyasiz
          # yangi kod bilan qayta ishga tushirish saytni jimgina buzadi
          # (ustun yo'q → har so'rov 500).
          ssh deploy-target "bash -lc '
            set -euo pipefail
            cd ~/hodimlar-tizimi
            PY=~/virtualenv/hodimlar-tizimi/3.11/bin/python
            echo \"Oldingi holat:\"
            \$PY -m alembic -c db/alembic.ini current
            \$PY -m alembic -c db/alembic.ini upgrade heads
            echo \"Yangi holat:\"
            \$PY -m alembic -c db/alembic.ini current
          '"

      - name: Web va botni qayta ishga tushirish
        run: |
          set -euo pipefail
          ssh deploy-target "bash -lc '
            set -euo pipefail
            cd ~/hodimlar-tizimi
            mkdir -p tmp
            touch tmp/restart.txt
            echo \"Passenger qayta ishga tushirildi\"
            # Bot polling rejimida alohida jarayonda ishlaydi va YANGI kodni
            # o'zi olmaydi. To\x27xtatamiz — keepalive cron (har 3 daqiqa)
            # uni yangi kod bilan ko\x27taradi.
            pkill -f \"bot\\.main\" || echo \"bot ishlamayotgan edi\"
            bash deploy/cpanel/keepalive_bot.sh || true
          '"

      - name: Tekshirish
        run: |
          set -uo pipefail
          # Passenger birinchi so'rovda ko'tariladi — biroz kutamiz.
          sleep 20
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              "https://nuriddin-building.uz/api/health" || echo -e "\n000")
            CODE=$(echo "$BODY" | tail -1)
            JSON=$(echo "$BODY" | sed '$d')
            echo "urinish $i: HTTP $CODE $JSON"
            if [ "$CODE" = "200" ]; then
              echo "✅ Sayt javob berdi."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deploy qilindi, lekin sayt javob bermayapti. Serverdagi logs/ ni tekshiring."
          exit 1

      - name: Botni tekshirish
        if: success()
        run: |
          set -uo pipefail
          ssh deploy-target "bash -lc '
            if pgrep -f \"bot\\.main\" > /dev/null; then
              echo \"✅ Bot ishlayapti (PID: \$(pgrep -f bot\\.main | head -1))\"
            else
              echo \"⚠️ Bot hali ko\x27tarilmagan — keepalive cron 3 daqiqada ko\x27taradi\"
            fi
          '"
