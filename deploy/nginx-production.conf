# PRODUCTION host nginx (konteynerlardan TASHQARIDA, serverning o'zida).
#
#   internet --HTTPS--> host nginx (shu fayl) --HTTP--> 127.0.0.1:8080 (web konteyner)
#                                                        └─ /api -> api konteyner (ichkarida)
#
# MUHIM: kamera (Face ID) va GPS faqat HTTPS'da ishlaydi — TLS'siz check-in
# umuman ishlamaydi. Sertifikat: `sudo certbot --nginx -d SIZNING_DOMEN`
# (certbot ssl_certificate satrlarini o'zi qo'shadi/yangilaydi).
#
# O'rnatish:
#   sudo cp deploy/nginx-production.conf /etc/nginx/sites-available/hodimlar
#   sudo ln -s /etc/nginx/sites-available/hodimlar /etc/nginx/sites-enabled/
#   "SIZNING_DOMEN" ni haqiqiy domenga almashtiring
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SIZNING_DOMEN

# ── 80-port: FAQAT HTTPS'ga yo'naltirish ──
# XAVFSIZLIK: ilgari bu yerda butun sayt HTTP orqali xizmat qilardi va
# HTTPS'ga yo'naltirish yo'q edi. Xodim brauzerga "domen.uz" deb yozsa
# (hech kim "https://" yozmaydi) — 30 KUNLIK JWT, yuz deskriptorlari va
# oylik ma'lumotlari ochiq trafikda ketardi. Ommaviy Wi-Fi'da bu tokenni
# o'g'irlash uchun yetarli.
server {
    listen 80;
    server_name SIZNING_DOMEN;

    # certbot HTTP-01 challenge shu yerdan o'tishi kerak — REDIRECTDAN OLDIN.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SIZNING_DOMEN;

    # certbot `--nginx` bilan shu ikki qatorni O'ZI qo'yadi/yangilaydi:
    #   ssl_certificate     /etc/letsencrypt/live/SIZNING_DOMEN/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/SIZNING_DOMEN/privkey.pem;

    client_max_body_size 20m;

    # ── Xavfsizlik sarlavhalari ──
    # cPanel deploy'da bular `deploy/cpanel/passenger_wsgi.py` dagi
    # middleware orqali qo'yiladi; bu yerda esa nginx qo'yadi. Ikkalasi bir
    # xil bo'lishi kerak — birini o'zgartirsangiz, ikkinchisini ham.
    #
    # HSTS: brauzer shu domenga BOSHQA hech qachon HTTP bilan bormasin.
    # DIQQAT: sertifikat ishlayotganiga ishonch hosil qilgach yoqing —
    # max-age davomida orqaga qaytish yo'q.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/geolocation — DAVOMAT UCHUN SHART, olib tashlamang.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    # CSP: JWT localStorage'da va mobil ilova uni WebView'ga kiritadi —
    # HTML-inyeksiya darhol hisob o'g'irlashga aylanardi, CSP shu zanjirni uzadi.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; frame-src https://oauth.telegram.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # DIQQAT: `$proxy_add_x_forwarded_for` mijoz yuborgan sarlavhaga
        # QO'SHADI — ya'ni birinchi qiymat MIJOZNIKI va unga ishonib
        # bo'lmaydi. Backend `api/deps.py: rate_limit` shu sababli ro'yxatning
        # OXIRIDAN sanaydi (`TRUSTED_PROXY_COUNT`). Bu yerga proxy qo'shsangiz,
        # o'sha sozlamani ham oshiring.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
